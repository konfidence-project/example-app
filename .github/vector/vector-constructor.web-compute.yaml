# The example vector with the Next.js frontend, without web-static. The web
# image contains the /_next/static files too, so the Next.js server answers
# that path itself and no static content deployer is needed. The routing in
# front must then send /_next/static to web. See vector-constructor.web.yaml
# for the full vector.
# ${REGISTRY} and ${VERSION} are expanded from the environment by `kden vector push`.
components:
  - name: github.com/konfidence-project/example-app/vector-web-compute
    version: ${VERSION}
    provider:
      name: konfidence
    componentReferences:
      - name: candidates
        componentName: github.com/konfidence-project/example-app/candidates
        version: ${VERSION}
      - name: interviews
        componentName: github.com/konfidence-project/example-app/interviews
        version: ${VERSION}
      - name: web
        componentName: github.com/konfidence-project/example-app/web
        version: ${VERSION}
    resources:
      - name: cloud-konfidence-vector-config
        type: json
        version: 1.0.0
        relation: local
        input:
          type: file/v1
          path: ./vector-config.json
