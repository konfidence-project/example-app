name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidates:
    name: candidates (Go)
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/candidates/go.mod
      - name: vet + test + build
        working-directory: services/candidates
        run: |
          go vet ./...
          go test ./...
          go build ./...

  interviews:
    name: interviews (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: install + typecheck + test
        working-directory: services/interviews
        run: |
          npm ci
          npx tsc -p . --noEmit
          npm test

  web:
    name: web + next-adapter (pnpm workspace)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      VERSION: 0.1.0-pr
    steps:
      - *checkout
      # Same pins as bin/hermit.hcl and the Konfidence repository.
      - &install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, format check, test
        run: pnpm verify

  web-artifacts:
    name: web artifacts (package, chart, image, smoke test)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      VERSION: 0.1.0-pr
    steps:
      - *checkout
      - *install-pnpm
      - *setup-node
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # next build, konfidence-next package (no registry access), helm lint
      # and template, docker build of the generated context, and a smoke test
      # of the image with the chart's security settings.
      - name: Verify generated artifacts
        run: pnpm verify:artifacts

  images:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - *checkout
      # Build both platforms the publish workflow pushes, so an arm64-only
      # breakage fails here instead of on Apple Silicon quickstart clusters.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build service + migration images
        run: |
          for dir in services/candidates services/candidates/migrations services/interviews services/interviews/migrations; do
            docker buildx build --platform linux/amd64,linux/arm64 "$dir"
          done

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: fsfe/reuse-action@v6
