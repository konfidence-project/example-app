name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidates:
    name: candidates (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/candidates/go.mod
      - name: vet + build
        working-directory: services/candidates
        run: |
          go vet ./...
          go build ./...

  interviews:
    name: interviews (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install + typecheck
        working-directory: services/interviews
        run: |
          npm ci
          npx tsc -p . --noEmit

  web:
    name: web + next-devtools (Next.js)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version named in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck + lint + format check + test
        run: pnpm verify
      - name: next build
        working-directory: services/web
        run: pnpm exec next build
      - name: helm lint
        run: helm lint --strict services/web/chart
      # The image copies the build output, so it is built after `next build`.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build web image
        run: docker buildx build --platform linux/amd64,linux/arm64 services/web

  images:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build both platforms the publish workflow pushes, so an arm64-only
      # breakage fails here instead of on Apple Silicon quickstart clusters.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build service + migration images
        run: |
          for dir in services/candidates services/candidates/migrations services/interviews services/interviews/migrations; do
            docker buildx build --platform linux/amd64,linux/arm64 "$dir"
          done

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
