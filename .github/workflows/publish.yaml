name: Publish

# Publishes all example-app artifacts (images, kustomize/helm deployment
# artifacts, OCM components) plus a release vector to the project's GHCR registry.
# Runs on main and the two failure fixture branches, and on demand.
# Uses the same hack/ scripts that run locally (REGISTRY + VERSION).
on:
  workflow_dispatch:
  push:
    branches: [main, failure/readiness, failure/migration]
    paths:
      - services/**
      - .github/vector/**
      - hack/**
      - .github/workflows/publish.yaml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}   # ghcr.io/konfidence-project/example-app
  FLUX_VERSION: 2.9.5
  # kden has no release with the fixes we need yet (0.0.1-alpha.1 `artifact push`
  # panics; authenticated external-ref resolution for `vector push`), so build it
  # from a pinned main commit.
  # TODO: switch to a released kden binary once one ships with these fixes.
  KDEN_REF: bfdd575491d239b453936d453c8bae9b7acd31e9

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select publication channel and version
        id: ver
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              channel=edge
              version="0.1.0-$(git rev-parse --short HEAD)"
              ;;
            refs/heads/failure/readiness)
              channel=failure-readiness
              version="0.1.0-${channel}.$(git rev-parse --short HEAD).${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
              ;;
            refs/heads/failure/migration)
              channel=failure-migration
              version="0.1.0-${channel}.$(git rev-parse --short HEAD).${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
              ;;
            *)
              echo "Unsupported publication ref: $GITHUB_REF" >&2
              exit 1
              ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The arm64 images run apk under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v5

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.4.3

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main
        with:
          version: ${{ env.FLUX_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install kden CLI
        run: |
          go install "github.com/konfidence-project/konfidence/cmd/kden@${KDEN_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test candidates
        working-directory: services/candidates
        run: go test ./...

      - name: Publish artifacts
        env:
          COMPONENT_CHANNEL: ${{ steps.ver.outputs.channel }}
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./hack/local-dev/02-pipeline.sh

      # Assemble a release vector pinning the components just published, so a
      # quickstart can deploy the vector directly. kden resolves the constructor's
      # relative paths against the working directory, so run it from the vector dir.
      - name: Build vector
        if: github.ref == 'refs/heads/main'
        working-directory: .github/vector
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.ver.outputs.version }}
          OCM_CONFIG: ${{ github.workspace }}/hack/local-dev/ocmconfig.yaml
        run: kden vector push -f vector-constructor.yaml -r "https://$REGISTRY"
