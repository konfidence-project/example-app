name: Publish

# Publishes all example-app artifacts (images, kustomize/helm deployment
# artifacts, OCM components) plus a release vector to the project's GHCR registry.
# Runs on every push to main that touches published artifacts, and on demand.
# Uses the same hack/ scripts that run locally (REGISTRY + VERSION).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/**
      - .github/vector/**
      - hack/**
      - .github/workflows/publish.yaml

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}   # ghcr.io/konfidence-project/example-app
  FLUX_VERSION: 2.9.5
  # kden has no release with the fixes we need yet (0.0.1-alpha.1 `artifact push`
  # panics; authenticated external-ref resolution for `vector push`), so build it
  # from a pinned main commit.
  # TODO: switch to a released kden binary once one ships with these fixes.
  KDEN_REF: bfdd575491d239b453936d453c8bae9b7acd31e9

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: automation
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute version
        id: ver
        run: echo "version=0.1.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The arm64 images run apk under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
        with:
          kustomize-version: 5.4.3

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@1816c594f1c4e37df419638f4b69a8ab39e0ed6b # reviewed main
        with:
          version: ${{ env.FLUX_VERSION }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Install kden CLI
        run: |
          go install "github.com/konfidence-project/konfidence/cmd/kden@${KDEN_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Publish artifacts
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./hack/local-dev/02-pipeline.sh

      # Assemble a release vector pinning the components just published, so a
      # quickstart can deploy the vector directly. kden resolves the constructor's
      # relative paths against the working directory, so run it from the vector dir.
      - name: Build vector
        working-directory: .github/vector
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.ver.outputs.version }}
          OCM_CONFIG: ${{ github.workspace }}/hack/local-dev/ocmconfig.yaml
        run: kden vector push -f vector-constructor.yaml -r "https://$REGISTRY"
