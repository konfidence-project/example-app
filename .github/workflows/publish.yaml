name: Publish

# Manually triggered publish of all example-app artifacts (images, kustomize/helm
# deployment artifacts, OCM components) plus a release vector, to the project's
# GHCR registry. Uses the same hack/ scripts that run locally (REGISTRY + VERSION).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}   # ghcr.io/konfidence-project/example-app
  FLUX_VERSION: 2.9.5
  # kden has no release with the fixes we need yet (0.0.1-alpha.1 `artifact push`
  # panics; authenticated external-ref resolution for `vector push`), so build it
  # from a pinned main commit.
  # TODO: switch to a released kden binary once one ships with these fixes.
  KDEN_REF: 22c675690afe8163518ee989d982c33021562e15

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: echo "version=0.1.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: azure/setup-helm@v4

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.4.3

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main
        with:
          version: ${{ env.FLUX_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install kden CLI
        run: |
          go install "github.com/konfidence-project/konfidence/cmd/kden@${KDEN_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Publish artifacts
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./hack/02-pipeline.sh

      # Assemble a release vector pinning the components just published, so a
      # quickstart can deploy the vector directly. kden resolves the constructor's
      # relative paths against the working directory, so run it from the vector dir.
      - name: Build vector
        working-directory: .github/vector
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.ver.outputs.version }}
          OCM_CONFIG: ${{ github.workspace }}/hack/ocmconfig.yaml
        run: kden vector push -f vector-constructor.yaml -r "https://$REGISTRY"
