version: 2
updates:
  - package-ecosystem: pip
    directory: "/app-source/productpage"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/app-source/ratings"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: "/app-source/details"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bundler-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/app-source/reviews"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - "/app-source/details"
      - "/app-source/productpage"
      - "/app-source/ratings"
      - "/app-source/reviews"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
