version: 2
updates:
  - package-ecosystem: gomod
    directory: "/services/candidates"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/services/interviews"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - "/services/candidates"
      - "/services/candidates/migrations"
      - "/services/interviews"
      - "/services/interviews/migrations"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
