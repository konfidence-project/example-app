# Assembles the deployable vector from the published component artifacts.
# ${REGISTRY} is your registry repo prefix (same as step 02); the 03 script
# substitutes it. Apply into the project namespace.
apiVersion: konfidence.cloud/v1alpha1
kind: VectorTemplate
metadata:
  name: example-app
spec:
  uploadTarget: oci::https://${REGISTRY}//github.com/konfidence-project/example-app/vector
  credentials:
    ocm:
      refs:
        - name: registry-credentials
  components:
    - name: oci::https://${REGISTRY}//github.com/konfidence-project/example-app/candidates:v0.1.0
    - name: oci::https://${REGISTRY}//github.com/konfidence-project/example-app/interviews:v0.1.0
  vectorConfig:
    features:
      allow-video-slots: false
      enable-candidate-notes: false
