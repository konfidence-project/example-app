apiVersion: konfidence.cloud/v1alpha1
kind: VectorTemplate
metadata:
  name: example-app
  namespace: example-landscape
spec:
  uploadTarget: oci::http://kind-registry:5000/example-app//github.com/konfidence-project/example-app/vector:main

  components:
    - name: oci::http://kind-registry:5000/example-app//github.com/konfidence-project/example-app/candidates:v0.1.0
    - name: oci::http://kind-registry:5000/example-app//github.com/konfidence-project/example-app/interviews:v0.1.0

  vectorConfig:
    features:
      allow-video-slots: false
      enable-candidate-notes: false
