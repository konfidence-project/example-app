# yaml-language-server: $schema=https://ocm.software/schemas/configuration-schema.yaml
components:
  - name: github.com/konfidence-project/bookinfo/details
    version: v1.20.2
    provider:
      name: konfidence-project
    sources: []
    resources:
      # Kustomization artifact (OCI reference)
      - name: details-kustomization
        version: v0.0.1
        relation: external
        type: ociArtifact
        access:
          type: ociArtifact
          imageReference: konfidence.common.repositories.cloud.sap/example-app-tests/kustomizations/details-v1

      # Konfidence deployment manifest
      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file
          path: ./manifest.json
