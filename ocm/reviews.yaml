# yaml-language-server: $schema=https://ocm.software/schemas/configuration-schema.yaml
components:
  - name: github.com/konfidence-project/bookinfo/reviews
    version: v1.0.0
    provider:
      name: konfidence-project
    sources: [ ]
    resources:
      # Kustomization artifact (OCI reference)
      - name: reviews-kustomization
        version: v1.0.0
        relation: external
        type: kustomize
        access:
          type: ociArtifact
          imageReference: konfidence.common.repositories.cloud.sap/example-app-tests/kustomizations/reviews:v1.0.0
      # Konfidence deployment manifest
      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file
          path: ./manifest.json

  - name: github.com/konfidence-project/bookinfo/reviews
