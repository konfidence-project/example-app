# yaml-language-server: $schema=https://ocm.software/schemas/configuration-schema.yaml
components:
  - name: github.com/konfidence-project/bookinfo/ratings
    version: v1.0.0
    provider:
      name: konfidence-project
    sources: []
    resources:
      # Kustomization artifact (OCI reference)
      - name: ratings-kustomization
        version: v1.0.0
        relation: external
        type: kustomize
        access:
          type: ociArtifact
          imageReference: konfidence.common.repositories.cloud.sap/example-app-tests/kustomizations/ratings:v1.0.0

      # Konfidence deployment manifest
      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file
          path: ./manifest.json

  - name: github.com/konfidence-project/bookinfo/ratings
    version: v2.0.0
    provider:
      name: konfidence-project
    sources: []
    resources:
      # Kustomization artifact (OCI reference)
      - name: ratings-kustomization
        version: v2.0.0
        relation: external
        type: kustomize
        access:
          type: ociArtifact
          imageReference: konfidence.common.repositories.cloud.sap/example-app-tests/kustomizations/ratings:v2.0.0
      # Konfidence deployment manifest
      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file
          path: ./manifest.json
      # Task manifest: verify-mysql-ready
      - name: verify-mysql-ready-manifest
        version: v1.0.0
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file
          path: ./ratings-tasks/verify-mysql-ready/task-manifest.json
      # Task manifest: run-schema-migration
      - name: run-schema-migration-manifest
        version: v1.0.0
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file
          path: ./ratings-tasks/run-schema-migration/task-manifest.json
      # Task manifest: verify-migration
      - name: verify-migration-manifest
        version: v1.0.0
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file
          path: ./ratings-tasks/verify-migration/task-manifest.json
      # Container image for all tasks
      - name: verify-migration-image
        version: v1.0.0
        relation: external
        type: ociImage
        access:
          type: ociArtifact
          imageReference: mysql:8.0
