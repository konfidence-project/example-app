# ${REGISTRY} is substituted at package time by the build script.
# image.tag is intentionally empty: it defaults to .Chart.AppVersion, which the
# build script sets from VERSION via `helm package --app-version`.
image:
  repository: ${REGISTRY}/interviews
  tag: ""
  pullPolicy: IfNotPresent

dbCredentialsSecret: example-app-db-credentials
vectorConfigUrl: http://vector-data-service
