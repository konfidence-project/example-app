# ${REGISTRY} and ${VERSION} are substituted at push time by the build script.
components:
  - name: github.com/konfidence-project/example-app/interviews
    version: ${VERSION}
    provider:
      name: konfidence-project
    sources: []
    resources:
      - name: interviews-chart
        version: ${VERSION}
        relation: external
        type: helmChart
        access:
          type: ociArtifact
          imageReference: ${REGISTRY}/interviews-chart:${VERSION}

      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file/v1
          path: ./konfidence-manifest.json

      - name: verify-db-ready-manifest
        version: ${VERSION}
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file/v1
          path: ./tasks/verify-db-ready/task-manifest.json

      - name: run-schema-migration-manifest
        version: ${VERSION}
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file/v1
          path: ./tasks/run-schema-migration/task-manifest.json

      - name: verify-migration-manifest
        version: ${VERSION}
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file/v1
          path: ./tasks/verify-migration/task-manifest.json

      - name: interviews-migrations-image
        version: ${VERSION}
        relation: external
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ${REGISTRY}/interviews-migrations:${VERSION}
