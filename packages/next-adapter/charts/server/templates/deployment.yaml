apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "server.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # Meets the Kubernetes "restricted" Pod Security Standard. 1000 is the
      # node user of the official Node.js images.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Next.js finishes in-flight requests on SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: ${NAME}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          # envFrom comes first and explicit env wins over it. PORT has to match
          # containerPort, so the ConfigMap cannot change it.
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
                optional: true
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- with .Values.vectorConfigUrl }}
            - name: VECTOR_CONFIG_URL
              value: {{ . | quote }}
            {{- end }}
            # Lets the server tell its own deployment result from the services it calls.
            - name: KONFIDENCE_DEPLOYMENT_RESULT
              value: "${DEPLOYMENT_RESULT}"
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The root filesystem is read-only, the Next.js cache and /tmp are emptyDir volumes.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: next-cache
              mountPath: ${CACHE_DIR}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
