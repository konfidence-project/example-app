# Generated by @konfidence/next-adapter. image.tag is empty on purpose: it
# defaults to .Chart.AppVersion, which is the artifact version.
image:
  repository: ${REGISTRY}/${NAME}
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
# -- Port the server listens on. Also sets PORT, so the ConfigMap cannot change it.
port: ${PORT}

# -- Base URL of the vector data service. Empty uses VECTOR_CONFIG_URL from
# the ConfigMap, or http://vector-data-service when that is unset too.
vectorConfigUrl: ""

# Optional ConfigMap in the landscape namespace with settings that differ per
# landscape. The Deployment starts without it.
configMapName: ${NAME}-config

# -- Path the readiness and liveness probes GET.
healthPath: "${HEALTH_PATH}"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

