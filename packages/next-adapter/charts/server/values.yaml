# Generated by @konfidence/next-adapter. image.tag is empty on purpose: it
# defaults to .Chart.AppVersion, which is the artifact version.
image:
  repository: ${REGISTRY}/${NAME}
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
port: ${PORT}

# Where the server finds the data of the vector it belongs to.
vectorConfigUrl: http://vector-data-service

# Optional ConfigMap in the landscape namespace with settings that differ per
# landscape. The Deployment starts without it.
configMapName: ${NAME}-config

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
