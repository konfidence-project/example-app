# <stage>.example.kden.local selects a stage and the first path segment selects
# the deployment result: the edge sets x-konfidence-stage and
# x-konfidence-service and forwards to that landscape's konfidence-router.
# Konfidence matches on both headers. Gateway API cannot derive a header from
# the subdomain or path, so every stage needs its own route and every exposed
# deployment result its own rule. set (not add) overwrites client-supplied
# values, so clients cannot pick another stage or service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dev-eu12
  namespace: edge-gateway
spec:
  parentRefs:
    - name: edge
  hostnames:
    - dev-eu12.example.kden.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /candidates
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-konfidence-stage
                value: dev-eu12
              - name: x-konfidence-service
                value: candidates
      backendRefs:
        - name: konfidence-router
          namespace: kden-l-dev
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /interviews
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-konfidence-stage
                value: dev-eu12
              - name: x-konfidence-service
                value: interviews
      backendRefs:
        - name: konfidence-router
          namespace: kden-l-dev
          port: 80
---
