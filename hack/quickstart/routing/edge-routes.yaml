# <stage>.example.kden.local selects a stage: the edge sets x-konfidence-stage
# and forwards to that landscape's konfidence-router. Gateway API cannot derive
# the header from the subdomain, so every stage needs its own route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dev-eu12
  namespace: edge-gateway
spec:
  parentRefs:
    - name: edge
  hostnames:
    - dev-eu12.example.kden.local
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-konfidence-stage
                value: dev-eu12
      backendRefs:
        - name: konfidence-router
          namespace: kden-l-dev
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prod-eu12
  namespace: edge-gateway
spec:
  parentRefs:
    - name: edge
  hostnames:
    - prod-eu12.example.kden.local
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-konfidence-stage
                value: prod-eu12
      backendRefs:
        - name: konfidence-router
          namespace: kden-l-prod
          port: 80
