# Tells each landscape to deploy into the local (in-cluster) control plane.
# One per artifact type (kustomize + helm) per managed namespace; omitting
# spec.parameters targets the local cluster, so no kubeconfig Secret is needed.
apiVersion: konfidence.cloud/v1alpha1
kind: DeploymentTarget
metadata:
  name: local-kustomize
  namespace: kden-l-dev
spec:
  artifactType: kustomize.konfidence.cloud
---
apiVersion: konfidence.cloud/v1alpha1
kind: DeploymentTarget
metadata:
  name: local-helm
  namespace: kden-l-dev
spec:
  artifactType: helm.konfidence.cloud
---
apiVersion: konfidence.cloud/v1alpha1
kind: DeploymentTarget
metadata:
  name: local-kustomize
  namespace: kden-l-prod
spec:
  artifactType: kustomize.konfidence.cloud
---
apiVersion: konfidence.cloud/v1alpha1
kind: DeploymentTarget
metadata:
  name: local-helm
  namespace: kden-l-prod
spec:
  artifactType: helm.konfidence.cloud
