# Static OCM config used by the publish pipeline. It carries NO credentials — it
# only tells OCM/kden to reuse the credentials from your Docker config (populated
# by `docker login`, or docker/login-action in CI). ~ is expanded by OCM.
#
# Override by exporting OCM_CONFIG to your own file before running the pipeline.
type: generic.config.ocm.software/v1
configurations:
  - type: credentials.config.ocm.software
    repositories:
      - repository:
          type: DockerConfig/v1
          dockerConfigFile: "~/.docker/config.json"
          propagateConsumerIdentity: true
