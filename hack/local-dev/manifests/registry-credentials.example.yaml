# Registry credentials the cluster uses to pull the published OCM artifacts and
# container images. You must provide these for your own registry.
#
# The 01 setup script creates this secret for you (from $REGISTRY_USERNAME /
# $REGISTRY_PASSWORD, or by prompting) in every namespace that needs it. This
# file documents the shape if you prefer to create it yourself:
#
#   kubectl -n <namespace> create secret docker-registry registry-credentials \
#     --docker-server=<your-registry-host> \
#     --docker-username=<user> --docker-password=<token>
#
# The secret is named "registry-credentials" and must exist in:
#   - konfidence-system   (controller fetches the vector)
#   - the project ns      (VectorTemplate assembles the vector)
#   - the managed ns      (Flux + kubelet pull artifacts and images)
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"YOUR_REGISTRY_HOST":{"username":"YOUR_USER","password":"YOUR_TOKEN"}}}
