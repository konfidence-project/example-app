# yaml-language-server: $schema=https://ocm.software/schemas/configuration-schema.yaml
components:
  - name: github.com/konfidence-project/bookinfo/ratings
    version: v2-mysql
    provider:
      name: konfidence-project
    sources: []
    resources:
      # Kustomization artifact (OCI reference)
      - name: ratings-v2-mysql-kustomization
        version: v0.0.1
        relation: external
        type: kustomize
        access:
          type: ociArtifact
          imageReference: konfidence.common.repositories.cloud.sap/example-app-tests/kustomizations/ratings-v2-mysql:v0.0.1

      # Konfidence deployment manifest
      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file
          path: ./manifest.json

      # Task manifest: test-task (simple logging task for initial testing)
      - name: test-task-manifest
        version: v0.0.1
        relation: local
        type: cloud.konfidence.artifact.task.manifest
        input:
          type: file
          path: ./task-manifests/test-task/task-manifest.json

      # Task container image: test-task
      - name: test-task-image
        version: v0.0.1
        relation: external
        type: ociImage
        access:
          type: ociArtifact
          imageReference: alpine:3.22.1

