# yaml-language-server: $schema=https://ocm.software/schemas/configuration-schema.yaml
components:
  - name: github.com/konfidence-project/bookinfo/mysqldb
    version: v1
    provider:
      name: konfidence-project
    sources: []
    resources:
      # Kustomization artifact (OCI reference)
      - name: mysqldb-kustomization
        version: v0.0.1
        relation: external
        type: kustomize
        access:
          type: ociArtifact
          imageReference: konfidence.common.repositories.cloud.sap/example-app-tests/kustomizations/mysqldb-v1:v0.0.1

      # Konfidence deployment manifest
      - name: konfidence-manifest
        relation: local
        type: cloud.konfidence.artifact.manifest
        input:
          type: file
          path: ./manifest.json

