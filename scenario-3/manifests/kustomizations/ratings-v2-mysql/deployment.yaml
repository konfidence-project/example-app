apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratings-v2-mysql
  labels:
    app: ratings
    version: v2-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratings
      version: v2-mysql
  template:
    metadata:
      labels:
        app: ratings
        version: v2-mysql
    spec:
      containers:
        - name: ratings
          image: ratings
          imagePullPolicy: Always
          ports:
            - containerPort: 9080
              name: http
          env:
            - name: SERVICE_VERSION
              value: "v2"
            - name: DB_TYPE
              value: "mysql"
            - name: MYSQL_DB_HOST
              value: "mysqldb"
            - name: MYSQL_DB_PORT
              value: "3306"
            - name: MYSQL_DB_USER
              value: "root"
            - name: MYSQL_DB_PASSWORD
              value: "password"
      imagePullSecrets:
        - name: konfidence-common-repositories-cloud-sap

